name: build-cuda-gb10-vllm-dsv41-b12x

on:
  push:
    branches: [main]
    paths:
      - 'cuda-gb10-vllm-dsv41-b12x/**'
      - 'scripts/vllm-gb10-dsv41-b12x-gate.sh'
      - 'scripts/dockerfile-parse-check.py'
      - '.github/workflows/build-cuda-gb10-vllm-dsv41-b12x.yml'
    tags: ['cuda-gb10-vllm-dsv41-b12x-v*']
  pull_request:
    paths:
      - 'cuda-gb10-vllm-dsv41-b12x/**'
      - 'scripts/vllm-gb10-dsv41-b12x-gate.sh'
      - 'scripts/dockerfile-parse-check.py'
      - '.github/workflows/build-cuda-gb10-vllm-dsv41-b12x.yml'
  workflow_dispatch: {}
  # NO schedule. Every input is pinned: the vLLM base by digest, the vLLM fork and b12x by commit, FlashInfer by
  # wheel sha256. A scheduled rebuild would recompile the fork for hours to restate what the pins already say.

permissions:
  contents: read

concurrency:
  group: build-cuda-gb10-vllm-dsv41-b12x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # arm64 native and a hard requirement rather than a preference: GB10 is
    # aarch64 Grace, the vLLM base publishes no amd64 manifest, and the fork is
    # compiled here for sm_121a. QEMU would not help.
    runs-on: ubuntu-24.04-arm
    # This image compiles the whole vLLM fork (csrc plus the CMake-fetched FA, DeepGEMM, qutlass, cutlass kernels),
    # far more than the EXL3 siblings' single extension. NOT YET MEASURED: the first build runs on a Spark and its
    # wall time decides whether this job compiles (under ~4 h at MAX_JOBS=2) or installs the Spark-built wheel via
    # VLLM_WHEEL_URL/VLLM_WHEEL_SHA256 (see the directory README). 350 sits just under the hosted runner's 360-minute
    # job cap so a compile that cannot fit fails as a timeout rather than being killed without logs.
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write      # push candidate to GHCR (trusted refs only)
      id-token: write      # keyless provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/defilantech/llmkube-vllm-cuda-gb10-dsv41-b12x
      LOCAL: ghcr.io/defilantech/llmkube-vllm-cuda-gb10-dsv41-b12x:ci-${{ github.sha }}
      # Bumping the base means editing both this and the Dockerfile's ARG BASE; the drift check enforces that.
      BASE_DIGEST: 'sha256:d84a123255b822fc22508635218000187221794f59c0694c33b0650d1e377d58'
      # Empty means compile the fork. Set both (in the same PR that publishes the wheel) to take the wheel route;
      # the pins gate then requires the installed wheel to carry exactly this hash and the pinned commit's tree.
      VLLM_WHEEL_URL: ''
      VLLM_WHEEL_SHA256: ''
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Hygiene: the arm runner has had ~121 GB free after this step; the fork's build tree plus a 9.7 GB base and
      # the 1.1 GB FlashInfer AOT wheel are the largest consumers. `df` in the log is the measurement.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
                      /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /

      # Cheap checks on the source tree before anything expensive runs: attribution present, no AGPL text, and the
      # pins gate's own tests (fixture checkouts with one wrong pin at a time) green.
      - name: Verify attribution, the absence of AGPL text, and the pins gate
        run: |
          cd cuda-gb10-vllm-dsv41-b12x
          fail=0
          for f in LICENSE.vllm-Apache-2.0 LICENSE.b12x-Apache-2.0 LICENSE.flashinfer-Apache-2.0 LICENSE.cutlass-BSD-3-Clause NOTICE \
                   licenses/LICENSE.flash-attention-BSD-3-Clause licenses/LICENSE.tml-fa4-BSD-3-Clause \
                   licenses/LICENSE.FlashMLA-MIT licenses/LICENSE.DeepGEMM-MIT licenses/LICENSE.triton-MIT \
                   licenses/LICENSE.FlashKDA-MIT licenses/LICENSE.DeepSelect-MIT licenses/LICENSE.MSA-MIT \
                   licenses/LICENSE.qutlass-Apache-2.0; do
            [ -f "$f" ] || { echo "FAIL: $f missing; the license requires the notice to travel."; fail=1; }
          done
          for f in LICENSE.vllm-Apache-2.0 LICENSE.b12x-Apache-2.0 LICENSE.flashinfer-Apache-2.0; do
            grep -q 'Apache License' "$f" || { echo "FAIL: $f is not the Apache text."; fail=1; }
          done
          grep -q 'Redistribution and use in source and binary forms' LICENSE.cutlass-BSD-3-Clause || { echo "FAIL: LICENSE.cutlass-BSD-3-Clause is not the BSD-3-Clause text."; fail=1; }
          if grep -rli --exclude-dir=__pycache__ 'GNU AFFERO' patches build tests 2>/dev/null | grep -q .; then
            echo "FAIL: AGPL text found in this directory's material."; fail=1
          fi
          python3 -m venv /tmp/pyt && /tmp/pyt/bin/pip install -q pytest
          /tmp/pyt/bin/python -m pytest -q -p no:cacheprovider tests/test_pins.py tests/test_deps_gate.py || { echo "FAIL: pins/deps gate tests"; fail=1; }
          exit $fail

      - name: Verify the base digest matches the Dockerfile
        run: |
          dockerfile_pin="$(sed -n 's|^ARG BASE=.*@\(sha256:[0-9a-f]\{64\}\)$|\1|p' \
            cuda-gb10-vllm-dsv41-b12x/Dockerfile)"
          echo "Dockerfile ARG BASE: ${dockerfile_pin}"
          echo "workflow env:        ${BASE_DIGEST}"
          if [ -z "${dockerfile_pin}" ]; then
            echo "FAIL: ARG BASE is not pinned to a sha256 digest."
            exit 1
          fi
          if [ "${dockerfile_pin}" != "${BASE_DIGEST}" ]; then
            echo "FAIL: base digest drift between the workflow and the Dockerfile."
            exit 1
          fi

      # Seconds, and deliberately before the multi-GB pull and the compile.
      - name: Dockerfile parse check (before the expensive pull)
        run: python3 scripts/dockerfile-parse-check.py $(git ls-files '*Dockerfile')

      - name: Shell syntax check
        run: |
          bash -n cuda-gb10-vllm-dsv41-b12x/entrypoint.sh
          bash -n scripts/vllm-gb10-dsv41-b12x-gate.sh
          bash -n cuda-gb10-vllm-dsv41-b12x/build/receipt.sh
          bash -n cuda-gb10-vllm-dsv41-b12x/build/apply_carried_patches.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # MAX_JOBS is derived from the runner, not fixed. vLLM's heaviest translation units (cutlass MoE and GEMM
      # kernels) take several GB of host RAM per nvcc process, so the cap is RAM/6 GiB as well as nproc: the hosted
      # arm runner (4 vCPU, 16 GB) gets 2, which is also upstream's own default. An OOM-killed nvcc surfaces as a
      # bare "Killed" with no useful error.
      - name: Choose a build parallelism the runner can survive
        run: |
          mem_gib="$(awk '/MemTotal/{printf "%d", $2/1024/1024}' /proc/meminfo)"
          jobs="$(nproc)"
          by_mem=$(( mem_gib / 6 )); [ "$by_mem" -lt 1 ] && by_mem=1
          [ "$jobs" -gt "$by_mem" ] && jobs="$by_mem"
          echo "MAX_JOBS=${jobs}" >> "${GITHUB_ENV}"
          echo "nproc=$(nproc) MemTotal=${mem_gib} GiB -> MAX_JOBS=${jobs}"

      # NO cache-from/cache-to. The Actions cache is 10 GB per repo shared across every workflow here, and this
      # image's compiled layer alone would dominate it, evicting the Vulkan, ROCm, CUDA and coder caches.
      - name: Build image (load locally for the gate)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: cuda-gb10-vllm-dsv41-b12x
          load: true
          tags: ${{ env.LOCAL }}
          build-args: |
            MAX_JOBS=${{ env.MAX_JOBS }}
            VLLM_WHEEL_URL=${{ env.VLLM_WHEEL_URL }}
            VLLM_WHEEL_SHA256=${{ env.VLLM_WHEEL_SHA256 }}

      - name: Disk after build
        if: always()
        run: df -h /

      # The gate re-asserts the Dockerfile's guarantees on the SHIPPED image: license texts, the pins gate, the
      # V4.1 attention import, the entrypoint's tree-digest verification, and the in-image suites including the
      # fork's own TP3 padding test.
      - name: Tier-1 gate (pins; fork vLLM + b12x; TP3 padding; in-image tests)
        run: ./scripts/vllm-gb10-dsv41-b12x-gate.sh "${{ env.LOCAL }}"

      # syft saves the loaded image as a tar under /tmp before scanning it. This image is ~47 GB uncompressed (the
      # vLLM base alone is ~21 GB) and the runner has ~33 GB left after a full compile, so drop the build cache first:
      # the gate has already run on the loaded image, which this does not touch.
      - name: Free the build cache for the SBOM scan
        run: |
          docker buildx prune -af >/dev/null || true
          docker builder prune -af >/dev/null || true
          df -h /

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.LOCAL }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cuda-gb10-vllm-dsv41-b12x-${{ github.sha }}
          path: sbom.spdx.json

      # --- Trusted refs only: main and release tags. PRs (including fork PRs,
      # whose GITHUB_TOKEN is read-only) and workflow_dispatch on any other
      # branch build + gate above but never push or attest. The candidate is unsigned-for-trust; the out-of-band GPU
      # promoter smoke-tests it on a real GB10 ring before anything serves. ---
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push candidate
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          CAND="${IMAGE}:candidate-${GITHUB_SHA}"
          docker tag "${LOCAL}" "${CAND}"
          docker push "${CAND}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${CAND}" | cut -d@ -f2)"
          echo "DIGEST=${DIGEST}" >> "${GITHUB_ENV}"
          echo "Pushed ${CAND} (${DIGEST})"

      - name: Attest build provenance
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
