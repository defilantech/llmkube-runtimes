name: build-cuda-gb10-qwen4exp

on:
  push:
    branches: [main]
    paths: ['cuda-gb10-qwen4exp/**', 'scripts/cuda-gate.sh', '.github/workflows/build-cuda-gb10-qwen4exp.yml']
    tags: ['cuda-gb10-qwen4exp-v*']
  pull_request:
    paths: ['cuda-gb10-qwen4exp/**', 'scripts/cuda-gate.sh', '.github/workflows/build-cuda-gb10-qwen4exp.yml']
  workflow_dispatch: {}
  # NO schedule here, unlike the sibling images. Their weekly canary rebuilds a
  # pinned ref to catch base-image and toolkit drift, which is worth it for a
  # runtime we serve from. This variant is a spike pinned to an unmerged PR
  # branch; a weekly rebuild of that SHA tells us nothing we act on and burns an
  # arm64 runner. Bump the pin by hand when the PR moves, or delete this variant
  # when #27742 merges.

permissions:
  contents: read

concurrency:
  group: build-cuda-gb10-qwen4exp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # arm64 native. GB10 is aarch64 Grace, so this image is arm64-only and there
  # is nothing to gain from a multi-arch manifest; building it under QEMU on an
  # x86 runner would turn a ~30 minute CUDA compile into an overnight job.
  # GitHub-hosted arm64 runners are free for this public repo.
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write       # push candidate to GHCR (trusted refs only)
      id-token: write        # keyless provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production server runtime (llama-server only; kept minimal).
          - target: server
            image: ghcr.io/defilantech/llmkube-llama-cuda-gb10-qwen4exp
          # Benchmarking + diagnostics tooling (llama-bench, llama-cli,
          # llama-server) from the SAME build stage / llama.cpp commit / codegen,
          # so its numbers describe what the server runtime does. Consumed
          # off-cluster for hardware benchmarking, never by the operator.
          - target: tools
            image: ghcr.io/defilantech/llmkube-llama-cuda-gb10-qwen4exp-tools
    env:
      IMAGE: ${{ matrix.image }}
      LOCAL: ${{ matrix.image }}:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # nvidia/cuda:13.0.1-devel is several GB before llama.cpp's build tree is
      # added on top, and a hosted runner ships ~14GB free. Reclaim preinstalled
      # toolchains we never use, same as build-rocm.yml does for the ~25GB ROCm
      # builder. df is printed so a future disk failure is diagnosable from the
      # log rather than by guesswork.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      # nvcc peaks hard per translation unit and ggml-cuda has ~140 of them.
      # Swap headroom keeps a cache-miss build reliable rather than
      # luck-of-the-runner, the same failure this repo already hit on the
      # Vulkan shader-gen step.
      - name: Add swap headroom
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # cache mode=min, deliberately unlike the other images' mode=max. A GitHub
      # Actions cache is 10GB per repo, shared across every workflow here; a
      # mode=max CUDA build would cache multi-GB intermediate layers and evict
      # the Vulkan, ROCm, Laguna and coder caches on every run, making all of
      # them slower to save this one. Only one architecture is compiled
      # (121a-real), so a cold build is ~30 minutes rather than upstream's
      # six-target hour-plus, which makes that trade cheap.
      - name: Build image (load locally for the gate)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: cuda-gb10-qwen4exp
          target: ${{ matrix.target }}
          load: true
          tags: ${{ env.LOCAL }}
          cache-from: type=gha,scope=cuda-gb10-qwen4exp-${{ matrix.target }}
          cache-to: type=gha,mode=min,scope=cuda-gb10-qwen4exp-${{ matrix.target }}

      # The two hard guards (native sm_121 present, RTLD_NOW dlopen clean) ran
      # inside the build stage above, where the CUDA toolkit lives. This checks
      # the shipped image: that the device code survived the COPY and that the
      # slim runtime layer launches. See the script for why CUDA needs its own
      # verdict logic instead of scripts/tier1-gate.sh.
      - name: Tier-1 gate (native sm_121 shipped; runtime image starts cleanly)
        run: ./scripts/cuda-gate.sh "${{ env.LOCAL }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.LOCAL }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cuda-gb10-qwen4exp-${{ matrix.target }}-${{ github.sha }}
          path: sbom.spdx.json

      # --- Trusted refs only. Fork PRs build + gate above, but never reach here:
      # GITHUB_TOKEN is read-only for them and these steps are gated off
      # pull_request. The candidate is unsigned-for-trust; the out-of-band GPU
      # promoter smoke-tests it on a real GB10 before anything consumes it. ---
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push candidate
        if: github.event_name != 'pull_request'
        run: |
          CAND="${IMAGE}:candidate-${GITHUB_SHA}"
          docker tag "${LOCAL}" "${CAND}"
          docker push "${CAND}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${CAND}" | cut -d@ -f2)"
          echo "DIGEST=${DIGEST}" >> "${GITHUB_ENV}"
          echo "Pushed ${CAND} (${DIGEST})"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

  # Stable required status check. Branch protection on main gates on "build";
  # this job reports it and succeeds only if every image matrix leg passed, so
  # the requirement is independent of the matrix leg names.
  build:
    needs: [image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all image builds passed
        run: |
          result="${{ needs.image.result }}"
          echo "image matrix result: ${result}"
          test "${result}" = "success"
